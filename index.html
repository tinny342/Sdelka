<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>Sell</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    -webkit-tap-highlight-color: transparent;
}

:root {
    --bg: #050505;
    --panel: #0b0c0e;
    --panel2: #101113;
    --border: #202226;
    --border-light: #303237;
    --text: #f4f4f4;
    --muted: #85878b;
    --muted2: #5f6166;
    --white: #ffffff;
}

html,
body {
    width: 100%;
    height: 100%;
    background: var(--bg);
    color: var(--text);
    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        Arial,
        sans-serif;
}

body {
    overflow: hidden;
}

button,
input,
textarea {
    font: inherit;
}

button {
    border: 0;
    outline: none;
    background: none;
    color: inherit;
}

#app {
    width: 100%;
    height: 100vh;
    position: relative;
    overflow: hidden;
    background: var(--bg);
}

/* =========================
   SPLASH
========================= */

.splash {
    position: absolute;
    inset: 0;
    z-index: 100;
    background: #000;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: opacity .5s ease;
}

.splash.hide {
    opacity: 0;
    pointer-events: none;
}

.logo {
    width: 72px;
    height: 72px;
    position: relative;
}

.logo span {
    position: absolute;
    width: 31px;
    height: 54px;
    border: 9px solid #fff;
    border-radius: 18px;
    transform: rotate(43deg);
}

.logo .one {
    left: 7px;
    top: 5px;
}

.logo .two {
    right: 7px;
    bottom: 5px;
}

.loading {
    position: absolute;
    left: 42px;
    right: 42px;
    bottom: 45px;
}

.loading-line {
    width: 100%;
    height: 2px;
    background: #1c1d1f;
    border-radius: 5px;
    overflow: hidden;
}

.loading-line span {
    display: block;
    width: 0;
    height: 100%;
    background: #fff;
    animation: loading 1.35s ease forwards;
}

.loading p {
    color: #66686d;
    text-align: center;
    font-size: 12px;
    margin-top: 10px;
}

@keyframes loading {
    to {
        width: 100%;
    }
}

/* =========================
   SCREEN
========================= */

.screen {
    width: 100%;
    height: 100%;
    overflow-y: auto;
    overflow-x: hidden;
    padding-bottom: 92px;
    scrollbar-width: none;
}

.screen::-webkit-scrollbar {
    display: none;
}

/* =========================
   HEADER
========================= */

.header {
    height: 76px;
    padding: 0 20px;
    display: flex;
    align-items: center;
    justify-content: space-between;
}

.brand {
    width: 39px;
    height: 39px;
    position: relative;
}

.brand span {
    position: absolute;
    width: 17px;
    height: 30px;
    border: 5px solid white;
    border-radius: 10px;
    transform: rotate(43deg);
}

.brand .a {
    left: 3px;
    top: 2px;
}

.brand .b {
    right: 3px;
    bottom: 2px;
}

.header-actions {
    display: flex;
    align-items: center;
    gap: 8px;
}

.header-btn {
    width: 40px;
    height: 40px;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
}

.header-btn svg {
    width: 23px;
    height: 23px;
    stroke: #ededed;
    fill: none;
    stroke-width: 1.8;
}

.red-dot {
    position: absolute;
    width: 6px;
    height: 6px;
    background: #fff;
    border-radius: 50%;
    right: 7px;
    top: 7px;
}

.avatar {
    width: 38px;
    height: 38px;
    border-radius: 50%;
    border: 1px solid #3a3b3f;
    background:
        radial-gradient(
            circle at 50% 35%,
            #d2d2d2 0 18%,
            transparent 19%
        ),
        radial-gradient(
            ellipse at 50% 100%,
            #777 0 37%,
            transparent 38%
        ),
        #26272a;
}

/* =========================
   SEARCH
========================= */

.search-wrap {
    padding: 0 20px;
}

.search {
    height: 54px;
    border-radius: 16px;
    background: #101113;
    border: 1px solid #17191c;
    display: flex;
    align-items: center;
    padding: 0 15px;
}

.search svg {
    width: 22px;
    height: 22px;
    stroke: #9b9da1;
    fill: none;
    stroke-width: 1.8;
    flex-shrink: 0;
}

.search input {
    flex: 1;
    height: 100%;
    min-width: 0;
    background: transparent;
    border: 0;
    outline: none;
    color: white;
    padding: 0 11px;
    font-size: 15px;
}

.search input::placeholder {
    color: #73757a;
}

.filter {
    width: 30px;
    height: 30px;
    display: flex;
    align-items: center;
    justify-content: center;
}

.filter svg {
    width: 21px;
    height: 21px;
}

/* =========================
   CATEGORIES
========================= */

.categories {
    display: flex;
    gap: 12px;
    padding: 17px 20px 6px;
}

.category {
    flex: 1;
    height: 116px;
    min-width: 0;
    background: #0b0c0e;
    border: 1px solid #191b1e;
    border-radius: 18px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 13px;
    color: #a4a5a8;
    transition: .2s;
}

.category.active {
    border-color: #393b40;
    background: #0e0f11;
    color: #fff;
}

.category svg {
    width: 32px;
    height: 32px;
    fill: none;
    stroke: currentColor;
    stroke-width: 1.7;
}

.category span {
    font-size: 13px;
    font-weight: 600;
}

/* =========================
   SECTION
========================= */

.section {
    padding: 22px 20px 0;
}

.section-top {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 14px;
}

.section-title {
    font-size: 20px;
    font-weight: 750;
    letter-spacing: -.3px;
}

.see-all {
    color: #d2d2d4;
    font-size: 14px;
    font-weight: 600;
}

/* =========================
   ADS
========================= */

.ads {
    display: flex;
    flex-direction: column;
    gap: 10px;
}

.ad {
    min-height: 92px;
    background: #0a0b0d;
    border: 1px solid #181a1d;
    border-radius: 17px;
    padding: 10px;
    display: flex;
    align-items: center;
    gap: 12px;
    transition: transform .15s;
}

.ad:active {
    transform: scale(.985);
}

.ad-icon {
    width: 72px;
    height: 72px;
    border-radius: 13px;
    background: #0f1012;
    border: 1px solid #191b1e;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #66686d;
    flex-shrink: 0;
}

.ad-icon svg {
    width: 30px;
    height: 30px;
    fill: none;
    stroke: currentColor;
    stroke-width: 1.5;
}

.ad-body {
    min-width: 0;
    flex: 1;
}

.ad-title {
    font-size: 15px;
    font-weight: 700;
    color: #eeeeef;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}

.ad-category {
    color: #77797e;
    font-size: 12px;
    margin-top: 7px;
}

.ad-fav {
    width: 39px;
    height: 39px;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #717379;
    flex-shrink: 0;
}

.ad-fav.active {
    color: white;
}

.ad-fav svg {
    width: 22px;
    height: 22px;
    fill: none;
    stroke: currentColor;
    stroke-width: 1.7;
}

/* =========================
   BOTTOM NAV
========================= */

.bottom {
    position: absolute;
    z-index: 20;
    bottom: 0;
    left: 0;
    right: 0;
    height: 80px;
    background: rgba(7,8,9,.97);
    border-top: 1px solid #17191c;
    display: grid;
    grid-template-columns: 1fr 1fr 1fr 1fr 1fr;
    align-items: center;
    padding: 0 7px;
}

.nav {
    height: 68px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 4px;
    color: #67696e;
    font-size: 10px;
    font-weight: 600;
}

.nav.active {
    color: #fff;
}

.nav svg {
    width: 23px;
    height: 23px;
    fill: none;
    stroke: currentColor;
    stroke-width: 1.7;
}

.plus {
    width: 53px;
    height: 53px;
    margin: -24px auto 0;
    border-radius: 50%;
    background: white;
    color: black;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 4px 18px rgba(255,255,255,.08);
}

.plus svg {
    width: 25px;
    height: 25px;
    stroke: black;
    stroke-width: 1.8;
}

/* =========================
   OTHER PAGES
========================= */

.page {
    height: 100%;
    overflow-y: auto;
    padding: 25px 20px 105px;
    scrollbar-width: none;
}

.page::-webkit-scrollbar {
    display: none;
}

.page-title {
    font-size: 27px;
    font-weight: 800;
    margin-bottom: 24px;
    letter-spacing: -.6px;
}

.empty {
    min-height: 400px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    text-align: center;
    color: #5d6065;
}

.empty svg {
    width: 45px;
    height: 45px;
    stroke: currentColor;
    fill: none;
    stroke-width: 1.4;
}

.empty strong {
    margin-top: 18px;
    color: #e7e7e8;
    font-size: 17px;
}

.empty span {
    color: #686a70;
    margin-top: 7px;
    font-size: 13px;
}

/* =========================
   PROFILE
========================= */

.profile-card {
    padding: 19px;
    background: #0b0c0e;
    border: 1px solid #191b1e;
    border-radius: 20px;
    display: flex;
    align-items: center;
    gap: 15px;
    margin-bottom: 18px;
}

.profile-avatar {
    width: 66px;
    height: 66px;
    border-radius: 50%;
    background:
        radial-gradient(
            circle at 50% 35%,
            #cfcfcf 0 17%,
            transparent 18%
        ),
        radial-gradient(
            ellipse at 50% 105%,
            #707070 0 38%,
            transparent 39%
        ),
        #25272a;
}

.profile-name {
    font-size: 18px;
    font-weight: 750;
}

.profile-sub {
    color: #73757a;
    font-size: 13px;
    margin-top: 5px;
}

.profile-item {
    width: 100%;
    height: 59px;
    border-radius: 15px;
    border: 1px solid #191b1e;
    background: #0b0c0e;
    margin-bottom: 9px;
    display: flex;
    align-items: center;
    padding: 0 15px;
    gap: 13px;
    color: #dedee0;
}

.profile-item svg {
    width: 21px;
    height: 21px;
    stroke: #999ba0;
    fill: none;
    stroke-width: 1.6;
}

.profile-item span {
    flex: 1;
    text-align: left;
    font-size: 14px;
}

.profile-item b {
    color: #65676c;
    font-size: 20px;
    font-weight: 400;
}

/* =========================
   MESSAGES
========================= */

.message {
    width: 100%;
    min-height: 76px;
    padding: 13px;
    border: 1px solid #191b1e;
    background: #0b0c0e;
    border-radius: 17px;
    display: flex;
    align-items: center;
    gap: 12px;
}

.message-avatar {
    width: 49px;
    height: 49px;
    border-radius: 50%;
    background: #1b1d20;
    display: flex;
    align-items: center;
    justify-content: center;
}

.message-avatar svg {
    width: 22px;
    height: 22px;
    stroke: #a0a2a6;
    fill: none;
}

.message-content {
    flex: 1;
}

.message-name {
    font-size: 14px;
    font-weight: 700;
}

.message-text {
    color: #71747a;
    font-size: 12px;
    margin-top: 5px;
}

/* =========================
   ADD PAGE
========================= */

.add-page {
    height: 100%;
    overflow-y: auto;
    padding: 20px 20px 35px;
}

.add-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    height: 48px;
    margin-bottom: 15px;
}

.add-head h2 {
    font-size: 18px;
}

.close {
    width: 40px;
    height: 40px;
    color: #aaa;
}

.close svg {
    width: 22px;
    height: 22px;
}

.form-label {
    font-size: 13px;
    color: #d8d8da;
    margin: 17px 0 8px;
    font-weight: 650;
}

.field {
    width: 100%;
    height: 54px;
    background: #0b0c0e;
    border: 1px solid #1c1e21;
    border-radius: 15px;
    outline: none;
    color: white;
    padding: 0 15px;
    font-size: 14px;
}

.field::placeholder,
textarea::placeholder {
    color: #61636a;
}

textarea.field {
    height: 125px;
    padding-top: 15px;
    resize: none;
}

.selects {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
}

.select {
    padding: 11px 14px;
    border-radius: 12px;
    border: 1px solid #1e2023;
    background: #0b0c0e;
    color: #777980;
    font-size: 12px;
}

.select.active {
    border-color: #686a70;
    color: white;
}

.publish {
    width: 100%;
    height: 55px;
    border-radius: 28px;
    margin-top: 25px;
    background: white;
    color: black;
    font-size: 15px;
    font-weight: 800;
}

/* =========================
   MODAL
========================= */

.modal {
    position: fixed;
    inset: 0;
    z-index: 80;
    background: rgba(0,0,0,.75);
    display: none;
    align-items: flex-end;
}

.modal.show {
    display: flex;
}

.modal-card {
    width: 100%;
    background: #0b0c0e;
    border-top: 1px solid #282a2e;
    border-radius: 25px 25px 0 0;
    padding: 18px 20px 28px;
}

.modal-handle {
    width: 42px;
    height: 4px;
    border-radius: 5px;
    background: #37393d;
    margin: 0 auto 18px;
}

.modal-icon {
    height: 150px;
    background: #090a0c;
    border: 1px solid #191b1e;
    border-radius: 17px;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #56585d;
    margin-bottom: 17px;
}

.modal-icon svg {
    width: 45px;
    height: 45px;
    fill: none;
    stroke: currentColor;
    stroke-width: 1.4;
}

.modal-title {
    font-size: 21px;
    font-weight: 800;
}

.modal-category {
    color: #73757a;
    font-size: 12px;
    margin-top: 6px;
}

.modal-description {
    color: #a0a2a7;
    font-size: 14px;
    line-height: 21px;
    margin-top: 17px;
}

.modal-actions {
    display: flex;
    gap: 9px;
    margin-top: 22px;
}

.modal-contact {
    flex: 1;
    height: 51px;
    border-radius: 26px;
    background: white;
    color: black;
    font-weight: 800;
}

.modal-favorite {
    width: 51px;
    height: 51px;
    border: 1px solid #292b2f;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
}

.modal-favorite svg {
    width: 22px;
    height: 22px;
    fill: none;
    stroke: white;
    stroke-width: 1.6;
}

.modal-close {
    display: block;
    margin: 12px auto 0;
    color: #777980;
    font-size: 13px;
}

/* =========================
   RESPONSIVE
========================= */

@media (min-width: 600px) {
    #app {
        max-width: 480px;
        margin: 0 auto;
        border-left: 1px solid #15171a;
        border-right: 1px solid #15171a;
    }
}
</style>
</head>

<body>

<div id="app">

    <!-- SPLASH -->
    <div class="splash" id="splash">

        <div class="logo">
            <span class="one"></span>
            <span class="two"></span>
        </div>

        <div class="loading">
            <div class="loading-line">
                <span></span>
            </div>
            <p>Загрузка...</p>
        </div>

    </div>


    <!-- MAIN CONTENT -->
    <div id="content"></div>


    <!-- BOTTOM NAV -->
    <nav class="bottom" id="bottom">

        <button class="nav active" data-page="home">
            <svg viewBox="0 0 24 24">
                <path d="M3 10.5L12 3l9 7.5"></path>
                <path d="M5 9.5V21h14V9.5"></path>
            </svg>
            <span>Главная</span>
        </button>


        <button class="nav" data-page="favorites">
            <svg viewBox="0 0 24 24">
                <path d="M20.5 8.8c0 5.3-8.5 10.1-8.5 10.1S3.5 14.1 3.5 8.8A4.5 4.5 0 0 1 12 6.7a4.5 4.5 0 0 1 8.5 2.1z"></path>
            </svg>
            <span>Избранное</span>
        </button>


        <button class="plus" id="plusButton">
            <svg viewBox="0 0 24 24">
                <path d="M12 5v14"></path>
                <path d="M5 12h14"></path>
            </svg>
        </button>


        <button class="nav" data-page="messages">
            <svg viewBox="0 0 24 24">
                <path d="M4 5h16v11H8l-4 4z"></path>
            </svg>
            <span>Сообщения</span>
        </button>


        <button class="nav" data-page="profile">
            <svg viewBox="0 0 24 24">
                <circle cx="12" cy="8" r="3.5"></circle>
                <path d="M5 21c.8-4 3.2-6 7-6s6.2 2 7 6"></path>
            </svg>
            <span>Профиль</span>
        </button>

    </nav>


    <!-- MODAL -->
    <div class="modal" id="modal">

        <div class="modal-card">

            <div class="modal-handle"></div>

            <div class="modal-icon" id="modalIcon"></div>

            <div class="modal-title" id="modalTitle"></div>

            <div class="modal-category" id="modalCategory"></div>

            <div class="modal-description" id="modalDescription"></div>

            <div class="modal-actions">

                <button class="modal-contact">
                    Связаться
                </button>

                <button class="modal-favorite" id="modalFavorite">
                    <svg viewBox="0 0 24 24">
                        <path d="M20.5 8.8c0 5.3-8.5 10.1-8.5 10.1S3.5 14.1 3.5 8.8A4.5 4.5 0 0 1 12 6.7a4.5 4.5 0 0 1 8.5 2.1z"></path>
                    </svg>
                </button>

            </div>

            <button class="modal-close" id="modalClose">
                Закрыть
            </button>

        </div>

    </div>

</div>


<script>

/* =====================================================
   ICONS
===================================================== */

const ICON = {

    home: `
        <svg viewBox="0 0 24 24">
            <path d="M3 10.5L12 3l9 7.5"></path>
            <path d="M5 9.5V21h14V9.5"></path>
        </svg>
    `,

    car: `
        <svg viewBox="0 0 24 24">
            <path d="M5 16l1.5-6h11L19 16"></path>
            <path d="M4 16h16v4H4z"></path>
            <circle cx="7" cy="19" r="1"></circle>
            <circle cx="17" cy="19" r="1"></circle>
        </svg>
    `,

    work: `
        <svg viewBox="0 0 24 24">
            <rect x="3" y="7" width="18" height="13" rx="2"></rect>
            <path d="M8 7V4h8v3"></path>
            <path d="M3 12h18"></path>
        </svg>
    `,

    heart: `
        <svg viewBox="0 0 24 24">
            <path d="M20.5 8.8c0 5.3-8.5 10.1-8.5 10.1S3.5 14.1 3.5 8.8A4.5 4.5 0 0 1 12 6.7a4.5 4.5 0 0 1 8.5 2.1z"></path>
        </svg>
    `,

    search: `
        <svg viewBox="0 0 24 24">
            <circle cx="10.8" cy="10.8" r="6.8"></circle>
            <path d="M16 16l5 5"></path>
        </svg>
    `,

    image: `
        <svg viewBox="0 0 24 24">
            <rect x="3" y="4" width="18" height="16" rx="2"></rect>
            <circle cx="8" cy="9" r="1.4"></circle>
            <path d="M3 17l5-5 4 4 3-3 6 6"></path>
        </svg>
    `

};


/* =====================================================
   DATA
===================================================== */

let ads = [

    {
        id: 1,
        title: "Современная квартира",
        category: "Недвижимость",
        description: "Современная и аккуратная квартира. Подробная информация доступна после открытия объявления."
    },

    {
        id: 2,
        title: "Автомобиль",
        category: "Транспорт",
        description: "Объявление о продаже автомобиля. Подробная информация доступна после открытия объявления."
    },

    {
        id: 3,
        title: "Frontend разработчик",
        category: "Работа",
        description: "Открытая вакансия для frontend разработчика."
    },

    {
        id: 4,
        title: "Помещение для работы",
        category: "Недвижимость",
        description: "Помещение подходит для различных рабочих задач."
    }

];

let favorites = [];

let currentPage = "home";

let selectedCategory = "Все";

let selectedAd = null;


/* =====================================================
   HELPERS
===================================================== */

function iconFor(category) {

    if (category === "Транспорт") {
        return ICON.car;
    }

    if (category === "Работа") {
        return ICON.work;
    }

    return ICON.home;
}


function escapeHTML(value) {

    return String(value)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");

}

/* =====================================================
   RENDER ADS
===================================================== */

function renderAds(search = "") {

    const box = document.getElementById("ads");

    if (!box) return;

    const query = search.toLowerCase().trim();

    const filtered = ads.filter(ad => {

        const categoryMatch =
            selectedCategory === "Все" ||
            ad.category === selectedCategory;

        const searchMatch =
            ad.title.toLowerCase().includes(query) ||
            ad.category.toLowerCase().includes(query);

        return categoryMatch && searchMatch;
    });


    if (filtered.length === 0) {

        box.innerHTML = `

            <div class="empty">

                ${ICON.search}

                <strong>
                    Ничего не найдено
                </strong>

                <span>
                    Попробуйте изменить запрос
                </span>

            </div>

        `;

        return;
    }


    box.innerHTML = filtered.map(ad => {

        const isFavorite =
            favorites.includes(ad.id);

        return `

            <article
                class="ad"
                data-id="${ad.id}"
            >

                <div class="ad-icon">
                    ${iconFor(ad.category)}
                </div>

                <div class="ad-body">

                    <div class="ad-title">
                        ${escapeHTML(ad.title)}
                    </div>

                    <div class="ad-category">
                        ${escapeHTML(ad.category)}
                    </div>

                </div>

                <button
                    class="ad-fav ${isFavorite ? "active" : ""}"
                    data-favorite="${ad.id}"
                >
                    ${ICON.heart}
                </button>

            </article>

        `;

    }).join("");


    document.querySelectorAll(".ad").forEach(card => {

        card.addEventListener("click", () => {

            const id =
                Number(card.dataset.id);

            const ad =
                ads.find(item => item.id === id);

            openAd(ad);

        });

    });


    document.querySelectorAll("[data-favorite]").forEach(button => {

        button.addEventListener("click", event => {

            event.stopPropagation();

            toggleFavorite(
                Number(button.dataset.favorite)
            );

        });

    });

}

/* =====================================================
   RENDER
===================================================== */

function render() {

    const content =
        document.getElementById("content");

    const bottom =
        document.getElementById("bottom");


    if (currentPage === "home") {

        content.innerHTML =
            homePage();

        bottom.style.display =
            "grid";

        setupHome();

    }


    if (currentPage === "favorites") {

        content.innerHTML =
            favoritesPage();

        bottom.style.display =
            "grid";

        setupFavoritePage();

    }


    if (currentPage === "messages") {

        content.innerHTML =
            messagesPage();

        bottom.style.display =
            "grid";

    }


    if (currentPage === "profile") {

        content.innerHTML =
            profilePage();

        bottom.style.display =
            "grid";

    }


    if (currentPage === "add") {

        content.innerHTML =
            addPage();

        bottom.style.display =
            "none";

        setupAdd();

    }


    updateNav();

}


/* =====================================================
   HOME EVENTS
===================================================== */

function setupHome() {

    renderAds();


    const input =
        document.getElementById("searchInput");


    input.addEventListener("input", () => {

        renderAds(input.value);

    });


    document.querySelectorAll(".category").forEach(button => {

        button.addEventListener("click", () => {

            const category =
                button.dataset.category;


            if (selectedCategory === category) {

                selectedCategory = "Все";

            } else {

                selectedCategory = category;

            }

            render();

        });

    });


    document
        .getElementById("allButton")
        .addEventListener("click", () => {

            selectedCategory = "Все";

            render();

        });


    document
        .getElementById("avatarButton")
        .addEventListener("click", () => {

            currentPage = "profile";

            render();

        });


    document
        .getElementById("bellButton")
        .addEventListener("click", () => {

            currentPage = "messages";

            render();

        });

}


/* =====================================================
   FAVORITE PAGE EVENTS
===================================================== */

function setupFavoritePage() {

    document.querySelectorAll(".ad").forEach(card => {

        card.addEventListener("click", () => {

            const ad =
                ads.find(
                    item =>
                        item.id ===
                        Number(card.dataset.id)
                );

            openAd(ad);

        });

    });


    document.querySelectorAll("[data-favorite]").forEach(button => {

        button.addEventListener("click", event => {

            event.stopPropagation();

            toggleFavorite(
                Number(button.dataset.favorite)
            );

        });

    });

}


/* =====================================================
   ADD EVENTS
===================================================== */

function setupAdd() {

    let category =
        "Недвижимость";


    document.querySelectorAll(".select").forEach(button => {

        button.addEventListener("click", () => {

            category =
                button.dataset.select;


            document
                .querySelectorAll(".select")
                .forEach(item =>
                    item.classList.remove("active")
                );


            button.classList.add("active");

        });

    });


    document
        .getElementById("closeAdd")
        .addEventListener("click", () => {

            currentPage = "home";

            render();

        });


    document
        .getElementById("publish")
        .addEventListener("click", () => {

            const title =
                document
                    .getElementById("newTitle")
                    .value
                    .trim();


            const description =
                document
                    .getElementById("newDescription")
                    .value
                    .trim();


            if (!title) {

                alert("Введите название объявления");

                return;

            }


            ads.unshift({

                id: Date.now(),

                title: title,

                category: category,

                description:
                    description ||
                    "Описание объявления отсутствует."

            });


            currentPage = "home";

            selectedCategory = "Все";

            render();

        });

}


/* =====================================================
   FAVORITE
===================================================== */

function toggleFavorite(id) {

    if (favorites.includes(id)) {

        favorites =
            favorites.filter(
                item => item !== id
            );

    } else {

        favorites.push(id);

    }


    if (currentPage === "favorites") {

        render();

    } else {

        render();

    }

}


/* =====================================================
   MODAL
===================================================== */

function openAd(ad) {

    if (!ad) return;

    selectedAd = ad;


    document
        .getElementById("modalTitle")
        .textContent =
            ad.title;


    document
        .getElementById("modalCategory")
        .textContent =
            ad.category;


    document
        .getElementById("modalDescription")
        .textContent =
            ad.description;


    document
        .getElementById("modalIcon")
        .innerHTML =
            iconFor(ad.category);


    document
        .getElementById("modal")
        .classList.add("show");

}


document
    .getElementById("modalClose")
    .addEventListener("click", () => {

        document
            .getElementById("modal")
            .classList.remove("show");

    });


document
    .getElementById("modal")
    .addEventListener("click", event => {

        if (event.target.id === "modal") {

            document
                .getElementById("modal")
                .classList.remove("show");

        }

    });


document
    .getElementById("modalFavorite")
    .addEventListener("click", () => {

        if (!selectedAd) return;

        toggleFavorite(selectedAd.id);

    });


/* =====================================================
   NAVIGATION
===================================================== */

document.querySelectorAll(".nav").forEach(button => {

    button.addEventListener("click", () => {

        currentPage =
            button.dataset.page;

        render();

    });

});


document
    .getElementById("plusButton")
    .addEventListener("click", () => {

        currentPage = "add";

        render();

    });


/* =====================================================
   NAV ACTIVE
===================================================== */

function updateNav() {

    document.querySelectorAll(".nav").forEach(button => {

        button.classList.toggle(
            "active",
            button.dataset.page === currentPage
        );

    });

}


/* =====================================================
   START
===================================================== */

setTimeout(() => {

    document
        .getElementById("splash")
        .classList.add("hide");

    setTimeout(() => {

        document
            .getElementById("splash")
            .remove();

    }, 500);

}, 1500);


render();

</script>
